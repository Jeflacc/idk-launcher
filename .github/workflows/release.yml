name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build Electron
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          OUT="dist-electron"
          mkdir -p upload

          if [ "${{ matrix.platform }}" = "win" ]; then
            cp "$OUT/IDK Launcher Setup"*.exe upload/ 2>/dev/null || true
            cp "$OUT"/*.zip upload/ 2>/dev/null || true
            cp "$OUT/latest.yml" upload/ 2>/dev/null || true
            cd upload
            OLD_EXE=$(ls *.exe 2>/dev/null | head -1)
            OLD_ZIP=$(ls *.zip 2>/dev/null | head -1)
            NEW_EXE="IDK-Launcher-${TAG}-Windows-x64.exe"
            NEW_ZIP="IDK-Launcher-${TAG}-Windows-x64.zip"
            [ -n "$OLD_EXE" ] && mv "$OLD_EXE" "$NEW_EXE"
            [ -n "$OLD_ZIP" ] && mv "$OLD_ZIP" "$NEW_ZIP"
            if [ -f "latest.yml" ]; then
              [ -n "$OLD_EXE" ] && perl -pi -e "s|\Q${OLD_EXE}\E|${NEW_EXE}|g" latest.yml
              [ -n "$OLD_ZIP" ] && perl -pi -e "s|\Q${OLD_ZIP}\E|${NEW_ZIP}|g" latest.yml
            fi
            cd ..

          elif [ "${{ matrix.platform }}" = "mac" ]; then
            cp "$OUT"/*.dmg upload/ 2>/dev/null || true
            cp "$OUT"/*-mac.zip upload/ 2>/dev/null || true
            cp "$OUT/latest-mac.yml" upload/ 2>/dev/null || true
            cd upload
            OLD_DMG=$(ls *.dmg 2>/dev/null | head -1)
            OLD_ZIP=$(ls *-mac.zip 2>/dev/null | head -1)
            NEW_DMG="IDK-Launcher-${TAG}-macOS.dmg"
            NEW_ZIP="IDK-Launcher-${TAG}-macOS.zip"
            [ -n "$OLD_DMG" ] && mv "$OLD_DMG" "$NEW_DMG"
            [ -n "$OLD_ZIP" ] && mv "$OLD_ZIP" "$NEW_ZIP"
            if [ -f "latest-mac.yml" ]; then
              [ -n "$OLD_DMG" ] && perl -pi -e "s|\Q${OLD_DMG}\E|${NEW_DMG}|g" latest-mac.yml
              [ -n "$OLD_ZIP" ] && perl -pi -e "s|\Q${OLD_ZIP}\E|${NEW_ZIP}|g" latest-mac.yml
            fi
            cd ..

          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cp "$OUT"/*.AppImage upload/ 2>/dev/null || true
            cp "$OUT"/*.deb upload/ 2>/dev/null || true
            cp "$OUT/latest-linux.yml" upload/ 2>/dev/null || true
            cd upload
            OLD_APP=$(ls *.AppImage 2>/dev/null | head -1)
            OLD_DEB=$(ls *.deb 2>/dev/null | head -1)
            NEW_APP="IDK-Launcher-${TAG}-Linux-x64.AppImage"
            NEW_DEB="IDK-Launcher-${TAG}-Linux-x64.deb"
            [ -n "$OLD_APP" ] && mv "$OLD_APP" "$NEW_APP"
            [ -n "$OLD_DEB" ] && mv "$OLD_DEB" "$NEW_DEB"
            if [ -f "latest-linux.yml" ]; then
              [ -n "$OLD_APP" ] && perl -pi -e "s|\Q${OLD_APP}\E|${NEW_APP}|g" latest-linux.yml
              [ -n "$OLD_DEB" ] && perl -pi -e "s|\Q${OLD_DEB}\E|${NEW_DEB}|g" latest-linux.yml
            fi
            cd ..

          fi

          echo "Uploading:"
          ls -la upload/

          FILE_COUNT=$(ls upload/ 2>/dev/null | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No artifacts found in upload/ directory. Build may have failed or output naming changed."
            exit 1
          fi
          echo "Found $FILE_COUNT artifact(s) to upload."

          gh release create "$TAG" upload/* --repo ${{ github.repository }} --title "$TAG" --generate-notes 2>/dev/null || \
            gh release upload "$TAG" upload/* --clobber --repo ${{ github.repository }}
          echo "Done"
