name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Electron
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          OUT="dist-electron"
          mkdir -p upload

          # Copy installers, archives, and auto-updater manifests
          find "$OUT" -maxdepth 1 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" -o -name "latest*.yml" \) -exec cp {} upload/ \;

          echo "Uploading:"
          ls -la upload/

          FILE_COUNT=$(ls upload/ 2>/dev/null | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No artifacts found in upload/ directory. Build may have failed."
            exit 1
          fi
          echo "Found $FILE_COUNT artifact(s) to upload."

          gh release create "$TAG" upload/* --repo ${{ github.repository }} --title "$TAG" --generate-notes 2>/dev/null || \
            gh release upload "$TAG" upload/* --clobber --repo ${{ github.repository }}
          echo "Done"
