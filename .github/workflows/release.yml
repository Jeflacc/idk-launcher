name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Electron
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          OUT="dist-electron"
          mkdir -p upload

          if [ "${{ matrix.platform }}" = "win" ]; then
            cp "$OUT"/*.exe upload/ 2>/dev/null || true
            cp "$OUT"/*.yml upload/ 2>/dev/null || true
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            cp "$OUT"/*.dmg upload/ 2>/dev/null || true
            cp "$OUT"/*.zip upload/ 2>/dev/null || true
            cp "$OUT"/*.yml upload/ 2>/dev/null || true
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cp "$OUT"/*.AppImage upload/ 2>/dev/null || true
            cp "$OUT"/*.deb upload/ 2>/dev/null || true
            cp "$OUT"/*.yml upload/ 2>/dev/null || true
          fi

          echo "Uploading:"
          ls -la upload/

          gh release create "$TAG" upload/* --repo ${{ github.repository }} --title "$TAG" --generate-notes || gh release upload "$TAG" upload/* --clobber --repo ${{ github.repository }}
          echo "Done"
