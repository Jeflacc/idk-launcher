name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Build Electron Binaries
        run: npx electron-builder --publish never

      - name: Rename Windows Artifacts
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Get-ChildItem dist-electron -File | Where-Object { $_.Name -match 'Setup.*\.exe$' -and $_.Name -notmatch 'uninstaller' } | ForEach-Object {
            Rename-Item $_.FullName -NewName "IDK-Launcher-$version-Windows-x64.exe"
          }
          Get-ChildItem dist-electron -File | Where-Object { $_.Name -match '\.blockmap$' } | Remove-Item -Force

      - name: Rename macOS Artifacts
        if: matrix.platform == 'mac'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist-electron
          for f in *.dmg; do [ -f "$f" ] && mv "$f" "IDK-Launcher-$VERSION-macOS.dmg"; done
          for f in *.zip; do [ -f "$f" ] && mv "$f" "IDK-Launcher-$VERSION-macOS.zip"; done

      - name: Rename Linux Artifacts
        if: matrix.platform == 'linux'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist-electron
          for f in *.AppImage; do [ -f "$f" ] && mv "$f" "IDK-Launcher-$VERSION-Linux-x64.AppImage"; done
          for f in *.deb; do [ -f "$f" ] && mv "$f" "IDK-Launcher-$VERSION-Linux-x64.deb"; done

      - name: Upload Windows Artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist-electron/*.exe
          retention-days: 5

      - name: Upload macOS Artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
          retention-days: 5

      - name: Upload Linux Artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List Downloaded Files
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
