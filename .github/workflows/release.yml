name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Delete Old Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete ${{ github.ref_name }} --yes || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --generate-notes

  build-windows:
    name: Build (Windows x64)
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Installer
        run: npx electron-builder --win --publish never

      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem dist-electron -File | Where-Object { $_.Name -match 'Setup.*\.exe$' -and $_.Name -notmatch 'uninstaller' } | Select-Object -First 1
          if ($exe) {
            $dest = "IDK-Launcher-$version-Windows-x64.exe"
            Copy-Item $exe.FullName $dest
            gh release upload ${{ github.ref_name }} $dest --clobber
          }

  build-mac:
    name: Build (macOS)
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build DMG
        run: npx electron-builder --mac --publish never

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for f in dist-electron/*.dmg; do
            [ -f "$f" ] && cp "$f" "IDK-Launcher-$VERSION-macOS.dmg" && gh release upload ${{ github.ref_name }} "IDK-Launcher-$VERSION-macOS.dmg" --clobber
          done

  build-linux:
    name: Build (Linux x64)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Packages
        run: npx electron-builder --linux --publish never

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for f in dist-electron/*.AppImage; do
            [ -f "$f" ] && cp "$f" "IDK-Launcher-$VERSION-Linux-x64.AppImage" && gh release upload ${{ github.ref_name }} "IDK-Launcher-$VERSION-Linux-x64.AppImage" --clobber
          done
          for f in dist-electron/*.deb; do
            [ -f "$f" ] && cp "$f" "IDK-Launcher-$VERSION-Linux-x64.deb" && gh release upload ${{ github.ref_name }} "IDK-Launcher-$VERSION-Linux-x64.deb" --clobber
          done
