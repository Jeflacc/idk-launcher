name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Build Electron Binaries
        run: npx electron-builder --publish never

      - name: Prepare Windows Release
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $release = "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Get-ChildItem dist-electron -File | Where-Object { $_.Name -match 'Setup.*\.exe$' -and $_.Name -notmatch 'uninstaller' } | ForEach-Object {
            Copy-Item $_.FullName "$release\IDK-Launcher-$version-Windows-x64.exe"
            Write-Host "Copied: $($_.Name) -> IDK-Launcher-$version-Windows-x64.exe"
          }

      - name: Prepare macOS Release
        if: matrix.platform == 'mac'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          for f in dist-electron/*.dmg; do
            [ -f "$f" ] && cp "$f" "release/IDK-Launcher-$VERSION-macOS.dmg" && echo "Copied: $(basename $f)"
          done

      - name: Prepare Linux Release
        if: matrix.platform == 'linux'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          for f in dist-electron/*.AppImage; do
            [ -f "$f" ] && cp "$f" "release/IDK-Launcher-$VERSION-Linux-x64.AppImage" && echo "Copied: $(basename $f)"
          done
          for f in dist-electron/*.deb; do
            [ -f "$f" ] && cp "$f" "release/IDK-Launcher-$VERSION-Linux-x64.deb" && echo "Copied: $(basename $f)"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: release/*
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List Release Files
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
