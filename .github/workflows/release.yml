name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Electron
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          OUT="dist-electron"
          mkdir -p upload

          if [ "${{ matrix.platform }}" = "win" ]; then
            cp "$OUT/IDK Launcher Setup"*.exe upload/ 2>/dev/null || true
            cp "$OUT"/*.zip upload/ 2>/dev/null || true
            cp "$OUT/latest.yml" upload/ 2>/dev/null || true
            cd upload
            for f in *.exe; do [ -f "$f" ] && mv "$f" "IDK-Launcher-${TAG}-Windows-x64.exe"; done
            for f in *.zip; do [ -f "$f" ] && mv "$f" "IDK-Launcher-${TAG}-Windows-x64.zip"; done
            cd ..

          elif [ "${{ matrix.platform }}" = "mac" ]; then
            cp "$OUT"/*.dmg upload/ 2>/dev/null || true
            cp "$OUT"/*-mac.zip upload/ 2>/dev/null || true
            cp "$OUT/latest-mac.yml" upload/ 2>/dev/null || true
            cd upload
            for f in *.dmg; do [ -f "$f" ] && mv "$f" "IDK-Launcher-${TAG}-macOS.dmg"; done
            for f in *-mac.zip; do [ -f "$f" ] && mv "$f" "IDK-Launcher-${TAG}-macOS.zip"; done
            cd ..

          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cp "$OUT"/*.AppImage upload/ 2>/dev/null || true
            cp "$OUT"/*.deb upload/ 2>/dev/null || true
            cp "$OUT/latest-linux.yml" upload/ 2>/dev/null || true
            cd upload
            for f in *.AppImage; do [ -f "$f" ] && mv "$f" "IDK-Launcher-${TAG}-Linux-x64.AppImage"; done
            for f in *.deb; do [ -f "$f" ] && mv "$f" "IDK-Launcher-${TAG}-Linux-x64.deb"; done
            cd ..

          fi

          echo "Uploading:"
          ls -la upload/

          gh release upload "$TAG" upload/* --clobber --repo ${{ github.repository }}
          echo "Done"
