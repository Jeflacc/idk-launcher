<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https: idk-cache: http:; media-src 'self' https: idk-cache:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-hashes'; connect-src 'self' https: http: ws:;"
    />
    <title>IDK Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      if (localStorage.getItem("idk_launcher_ui_mode") === "advanced") {
        document.body.classList.add("ui-advanced");
        document.body.dataset.uiMode = "advanced";
      }
    </script>
    <!--
      App shell containers. loadAppShell() (core/html-loader.js) appends
      partials/ views/ modals/ HTML files into these in a fixed order.
      All visual children are absolute/fixed-positioned against #app
      (position: relative), so these static wrappers are layout-neutral.
    -->
    <div id="app">
      <div id="background-layer"></div>
      <div id="top-bar-container"></div>
      <div id="views-root"></div>
      <div id="modals-root"></div>
      <div id="chat-root"></div>
    </div>

    
    <script type="module" src="/main.js"></script>
  </body>
</html>
