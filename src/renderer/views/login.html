<!-- LOGIN VIEW -->
<div id="view-login" class="view active">
  <div class="login-box">
    <h2>Welcome Back</h2>
    <p class="login-subtitle">Choose your login method.</p>

    <div class="login-btn microsoft" id="btn-microsoft-login">
      <img src="microsoft.png" alt="Microsoft Logo" width="24" height="24" style="object-fit: contain;" />
      Microsoft Account
    </div>

    <div class="login-btn elyby" id="btn-elyby-login">
      <img src="elyby.jpg" alt="Ely.by Logo" width="22" height="22" style="border-radius: 4px; object-fit: cover;" />
      Ely.by Account
    </div>

    <div class="login-btn offline-toggle" id="btn-offline-login">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M18 22H8v-2h10v2ZM8 20H6v-2h2v2Zm12 0h-2v-2h2v2ZM6 18H4v-2h2v2Zm16 0h-2v-4h-2v-2h2v-2h2v8ZM4 16H2V6h2v10Zm14 0h-6v-2h6v2Zm-6-2h-2v-2h2v2Zm-2-2H8V6h2v6ZM6 6H4V4h2v2Zm8-2h-2v2h-2V4H6V2h8v2Z"/></svg>
      Play with Username (Offline)
    </div>

    <div class="offline-form" id="offline-form">
      <input type="text" class="clean-input" id="login-username" placeholder="Enter username..." />
      <button class="submit-btn" id="btn-submit-login">Enter Launcher</button>
    </div>
  </div>
</div>
