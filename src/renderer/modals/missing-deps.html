<!-- MISSING DEPENDENCIES MODAL (filled by features/launch/launch-feature.js) -->
<div id="missing-deps-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#1a1a1b;border:2px solid var(--theme-accent);border-radius:8px;padding:32px;max-width:480px;width:90%;font-family:var(--font-title);">
    <div style="text-align:center;margin-bottom:20px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" style="color:#f59e0b;margin-bottom:12px;" viewBox="0 0 24 24"><path d="M2 10h2v2H2zm0 4h2v-2H2zm20-4h-2v2h2zm0 4h-2v-2h2zM4 8h2v2H4zm0 8h2v-2H4zm16-8h-2v2h2zm0 8h-2v-2h2zM6 6h2v2H6zm0 12h2v-2H6zM18 6h-2v2h2zm0 12h-2v-2h2zM8 4h2v2H8zm0 16h2v-2H8zm8-16h-2v2h2zm0 16h-2v-2h2zM10 2h2v2h-2zm0 20h2v-2h-2zm4-20h-2v2h2zm0 20h-2v-2h2zm-3-5h2v-2h-2zm0-4h2V7h-2z"/></svg>
      <h2 style="font-size:20px;color:white;margin:0 0 8px;">Missing Dependencies</h2>
      <p style="color:#888;font-size:13px;margin:0;">The game crashed because these required mods are missing:</p>
    </div>
    <ul id="missing-deps-list" style="list-style:none;padding:0;margin:0 0 24px;max-height:200px;overflow-y:auto;"></ul>
    <div style="display:flex;gap:10px;">
      <button id="btn-auto-install-deps" style="flex:1;background:var(--theme-accent);border:none;border-radius:4px;padding:12px;color:white;font-family:var(--font-title);font-size:13px;font-weight:700;cursor:pointer;">
        Auto-Install All
      </button>
      <button id="btn-dismiss-deps" style="flex:1;background:#3a3a3b;border:none;border-radius:4px;padding:12px;color:white;font-family:var(--font-title);font-size:13px;font-weight:700;cursor:pointer;">
        Dismiss
      </button>
    </div>
    <div id="deps-install-status" style="margin-top:12px;font-size:12px;color:#888;text-align:center;"></div>
  </div>
</div>
