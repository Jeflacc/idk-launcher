<!-- Generic list dialog -->
<div id="list-dialog-modal" class="confirm-modal">
  <div class="confirm-modal-content confirm-modal-content--neutral">
    <h3 id="list-dialog-title">Select Option</h3>
    <p id="list-dialog-message"></p>
    <div class="list-dialog-items" id="list-dialog-items">
      <!-- dynamically populated -->
    </div>
    <div class="confirm-modal-actions">
      <button type="button" id="list-dialog-cancel" class="confirm-modal-btn cancel">Cancel</button>
    </div>
  </div>
</div>
