appId: com.idklauncher.app
productName: IDK Launcher
directories:
  output: release
  buildResources: build-resources
files:
  - dist-main/**/*
  - dist-renderer/**/*
  - assets/**/*
  - package.json
asar: true
asarUnpack:
  - dist-main/workers/**
mac:
  category: public.app-category.games
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target:
    - nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target:
    - AppImage
    - deb
  category: Game
publish:
  provider: github
  owner: Jeflacc
  repo: idk-launcher
